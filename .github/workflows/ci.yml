name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24.22.1, 26.12.1]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test Jules review automation
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm pack --dry-run
      - name: Verify packing restored the manifest
        run: git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml

  windows-queue:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify outbox filesystem behavior on Windows
        run: pnpm exec vitest run src/retain-outbox.test.ts src/retain-queue.test.ts --maxWorkers=2
